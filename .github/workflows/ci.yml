name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Build & lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Valeurs factices : le build n'a pas besoin des vraies clés
      VITE_SUPABASE_URL: https://ci.supabase.co
      VITE_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
